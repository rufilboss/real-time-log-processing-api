<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Log Processing API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <h1 class="text-2xl font-bold text-gray-900">Real-Time Log Processing API</h1>
                <p class="text-sm text-gray-600 mt-1">Submit logs and monitor processing tasks</p>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Log Submission Form -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h2 class="text-xl font-semibold mb-4">Submit Log Entry</h2>
                    <form 
                        hx-post="/ui/submit"
                        hx-target="#result-message"
                        hx-swap="innerHTML"
                        class="space-y-4"
                    >
                        <div>
                            <label for="log-data" class="block text-sm font-medium text-gray-700 mb-2">
                                Log Data (JSON)
                            </label>
                            <textarea
                                id="log-data"
                                name="log_data"
                                rows="8"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 font-mono text-sm"
                                placeholder='{"username": "john_doe", "email": "john@example.com", "activity": "login_attempt"}'
                                required
                            ></textarea>
                            <p class="mt-1 text-xs text-gray-500">Enter valid JSON data</p>
                        </div>
                        <button
                            type="submit"
                            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition"
                        >
                            Submit Log
                        </button>
                        <div id="result-message" class="mt-4"></div>
                    </form>
                </div>

                <!-- Recent Logs -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">Recent Logs</h2>
                        <button
                            hx-get="/ui/logs"
                            hx-target="#logs-list"
                            hx-swap="innerHTML"
                            class="text-sm text-blue-600 hover:text-blue-800"
                        >
                            Refresh
                        </button>
                    </div>
                    <div 
                        id="logs-list"
                        hx-get="/ui/logs"
                        hx-trigger="load"
                        hx-swap="innerHTML"
                    >
                        <p class="text-gray-500">Loading...</p>
                    </div>
                </div>
            </div>

            <!-- Task Status -->
            <div class="mt-6 bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Task Status Monitor</h2>
                <div class="mb-4">
                    <form 
                        hx-get="/ui/task-status"
                        hx-target="#task-result"
                        hx-swap="innerHTML"
                        class="flex gap-2"
                    >
                        <input
                            type="text"
                            name="task_id"
                            placeholder="Enter task ID"
                            class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            required
                        />
                        <button
                            type="submit"
                            class="bg-gray-600 text-white py-2 px-4 rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500"
                        >
                            Check Status
                        </button>
                    </form>
                </div>
                <div id="task-result"></div>
            </div>
        </main>
    </div>
</body>
</html>
