{% if task %}
<div class="border border-gray-200 rounded-md p-4">
    <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold">Task: <code class="text-sm">{{ task.task_id }}</code></h3>
        <span class="px-3 py-1 rounded-full text-xs font-medium
            {% if task.status == 'SUCCESS' %}bg-green-100 text-green-800
            {% elif task.status == 'PENDING' %}bg-yellow-100 text-yellow-800
            {% elif task.status == 'FAILURE' %}bg-red-100 text-red-800
            {% else %}bg-gray-100 text-gray-800
            {% endif %}">
            {{ task.status }}
        </span>
    </div>
    {% if task.result %}
    <div class="mt-3">
        <p class="text-sm font-medium text-gray-700 mb-1">Result:</p>
        <pre class="bg-gray-50 border border-gray-200 rounded p-2 text-xs overflow-x-auto">{{ task.result_json }}</pre>
    </div>
    {% endif %}
</div>
{% else %}
<div class="bg-red-50 border border-red-200 rounded-md p-3">
    <p class="text-red-800">Task not found</p>
</div>
{% endif %}
