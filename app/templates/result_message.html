{% if success %}
<div class="bg-green-50 border border-green-200 rounded-md p-3">
    <p class="text-green-800 font-medium">✓ {{ message }}</p>
    {% if log_id %}
    <p class="text-sm text-green-700 mt-1">Log ID: <code class="bg-green-100 px-1 rounded">{{ log_id }}</code></p>
    {% endif %}
    {% if task_id %}
    <p class="text-sm text-green-700 mt-1">Task ID: <code class="bg-green-100 px-1 rounded">{{ task_id }}</code></p>
    {% endif %}
</div>
{% else %}
<div class="bg-red-50 border border-red-200 rounded-md p-3">
    <p class="text-red-800 font-medium">✗ {{ message }}</p>
</div>
{% endif %}
