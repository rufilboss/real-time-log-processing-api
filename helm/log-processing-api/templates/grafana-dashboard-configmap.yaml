{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "log-processing-api.fullname" . }}-grafana
  labels:
    grafana_dashboard: "1"
data:
  log-processing-api-dashboard.json: |
    {
      "title": "Log Processing API",
      "panels": [
        {"type": "graph", "title": "Requests/sec", "targets": [{"expr": "sum(rate(http_requests_total[5m]))"}]},
        {"type": "graph", "title": "p95 Latency", "targets": [{"expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))"}]},
        {"type": "graph", "title": "5xx Rate", "targets": [{"expr": "sum(rate(http_requests_total{status=~\\"5..\\"}[5m]))"}]}
      ]
    }
{{- end }}

