apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "log-processing-api.fullname" . }}
  labels:
    {{- include "log-processing-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "log-processing-api.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "log-processing-api.fullname" . }}
        {{- include "log-processing-api.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ .Values.env.APP_NAME | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: MONGO_URI
              value: {{ .Values.env.MONGO_URI | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

