{{- if .Values.celery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "log-processing-api.fullname" . }}-celery
  labels:
    {{- include "log-processing-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.celery.replicas }}
  selector:
    matchLabels:
      app: {{ include "log-processing-api.fullname" . }}-celery
  template:
    metadata:
      labels:
        app: {{ include "log-processing-api.fullname" . }}-celery
        {{- include "log-processing-api.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: celery
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "app.celery_config", "worker", "--loglevel=info"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: APP_NAME
              value: {{ .Values.env.APP_NAME | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: MONGO_URI
              value: {{ .Values.env.MONGO_URI | quote }}
            - name: REDIS_URL
              value: {{ .Values.env.REDIS_URL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}

