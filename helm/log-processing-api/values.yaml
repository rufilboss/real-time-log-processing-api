image:
  repository: asruf/log-processing-api
  tag: latest
  pullPolicy: IfNotPresent

celery:
  enabled: true
  replicas: 1

replicaCount: 2

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false
  className: ""
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

env:
  APP_NAME: real-time-log-processing-api
  LOG_LEVEL: INFO
  MONGO_URI: mongodb://mongo:27017/log_database
  REDIS_URL: redis://redis:6379/0

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceMonitor:
  enabled: false
  interval: 30s

networkPolicy:
  enabled: true

alerts:
  enabled: true
  errorRateThreshold: 2 # percent
  latencyP95Threshold: 0.5 # seconds
  cpuSaturationThreshold: 90 # percent

grafanaDashboard:
  enabled: false

